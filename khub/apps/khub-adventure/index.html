<div id='kadv-wrap' style='text-align:center;padding:10px 5px;'> <div style='border-bottom:3px solid #000;padding-bottom:8px;margin-bottom:12px;text-align:left;'> <strong style='font-size:22px;'>AI Quest</strong> <span id='kadv-step-label' style='font-size:16px;font-weight:bold;margin-left:10px;'>Choice 1 / 50</span> <span id='kadv-status-label' style='font-size:13px;font-weight:bold;float:right;margin-top:4px;'>Ready</span> </div> <div id='kadv-story-box' style='border:4px solid #000;padding:16px;min-height:165px;text-align:left;font-size:21px;line-height:1.5;margin-bottom:16px;background:#fff;color:#000;'> Generating a brand new adventure... </div> <div id='kadv-choices-row' style='margin-bottom:14px;'> <button type='button' id='kadv-btn-0' class='btn' style='width:31%;padding:16px 6px;font-size:21px;' onclick='kadvChoose(0)'>...</button> <button type='button' id='kadv-btn-1' class='btn' style='width:31%;padding:16px 6px;font-size:21px;' onclick='kadvChoose(1)'>...</button> <button type='button' id='kadv-btn-2' class='btn' style='width:31%;padding:16px 6px;font-size:21px;' onclick='kadvChoose(2)'>...</button> </div> <div id='kadv-newgame-row' class='hidden' style='margin-bottom:14px;'> <button type='button' class='btn btn-selected' style='width:90%;padding:18px;font-size:23px;' onclick='kadvNewGame()'>Create New Game</button> </div> <div style='margin-top:8px;'> <button type='button' class='btn-sm' style='font-size:16px;padding:8px 12px;' onclick='kadvNewGame()'>Restart / New Game</button> </div> </div> <script> var KADV_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent'; var KADV_MAX_STEPS = 50; var KADV_SEEDS = [ 'a derelict starship drifting near a ringed gas giant', 'a rain-slicked neon alley in a clockwork metropolis', 'a subterranean research outpost beneath Antarctic ice', 'a floating sky-island bazaar during a solar eclipse', 'a haunted frontier train crossing a canyon at midnight', 'an ancient overgrown library where books whisper secrets', 'a deep-sea submersible discovering a glowing trench city', 'a desert caravan arriving at a mirage fortress of glass', 'a snowbound mountain monastery guarding a celestial vault', 'a time-looping lighthouse on the edge of a shattered sea' ]; var kadvState = { step: 1, finished: false, story: '', options: [] }; function kadvGetKey() { if (window.getGlobalApiKey) return window.getGlobalApiKey(); try { return (localStorage.getItem('khub_global_api_key') || '').replace(/^\s+|\s+$/g, ''); } catch (e) { return ''; } } function kadvEnsureKey() { var k = kadvGetKey(); if (!k) { if (window.showAiKeyRequiredPopup) { window.showAiKeyRequiredPopup('AI Tap Adventure'); } return false; } return true; } function kadvCleanPara(t) { if (!t) return 'You awaken in an unfamiliar realm as distant echoes beckon you forward.'; var s = String(t).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, ''); s = s.replace(/^you\s+(chose|choose|selected|picked|tapped)\s+[a-zA-Z]+\s*[.,!:-]*\s*/i, ''); if (s.length > 520) s = s.substring(0, 517) + '...'; return s; } function kadvOneWord(w, fallback) { if (!w) return fallback; var clean = String(w).replace(/[^a-zA-Z]/g, ''); if (!clean) return fallback; return clean.charAt(0).toUpperCase() + clean.slice(1, 14).toLowerCase(); } function kadvSave() { try { localStorage.setItem('khub_kadv_state_v4', JSON.stringify(kadvState)); } catch (e) {} } function kadvLoad() { try { var raw = localStorage.getItem('khub_kadv_state_v4'); if (raw) { var parsed = JSON.parse(raw); if (parsed && parsed.story && parsed.options && parsed.options.length === 3) { kadvState = parsed; return true; } } } catch (e) {} return false; } function kadvRender() { var stepEl = document.getElementById('kadv-step-label'); var statusEl = document.getElementById('kadv-status-label'); var boxEl = document.getElementById('kadv-story-box'); var choicesRow = document.getElementById('kadv-choices-row'); var newGameRow = document.getElementById('kadv-newgame-row'); if (!boxEl) return; if (statusEl) statusEl.innerHTML = 'Ready'; if (kadvState.finished || kadvState.step > KADV_MAX_STEPS) { stepEl.innerHTML = 'Ending Reached (50 / 50)'; boxEl.innerHTML = kadvCleanPara(kadvState.story); choicesRow.className = 'hidden'; newGameRow.className = ''; return; } if (kadvState.step === KADV_MAX_STEPS) { stepEl.innerHTML = 'Final Choice (50 / 50) - Choose the Ending!'; } else { stepEl.innerHTML = 'Choice ' + kadvState.step + ' / ' + KADV_MAX_STEPS; } boxEl.innerHTML = kadvCleanPara(kadvState.story); choicesRow.className = ''; newGameRow.className = 'hidden'; var opts = kadvState.options || ['Explore', 'Inspect', 'Advance']; for (var i = 0; i < 3; i++) { var b = document.getElementById('kadv-btn-' + i); if (b) { b.disabled = false; b.innerHTML = kadvOneWord(opts[i], i === 0 ? 'Explore' : (i === 1 ? 'Inspect' : 'Advance')); } } } function kadvCallGemini(promptText, includeThinking, cb) { var apiKey = kadvGetKey(); if (!apiKey) { kadvEnsureKey(); cb(false, null); return; } var xhr = new XMLHttpRequest(); xhr.timeout = 22000; var url = KADV_URL + '?key=' + encodeURIComponent(apiKey); var genCfg = { maxOutputTokens: 800, temperature: 0.9 }; if (includeThinking) { genCfg.thinkingConfig = { thinkingBudget: 0 }; } var body = JSON.stringify({ contents: [{ role: 'user', parts: [{ text: promptText }] }], generationConfig: genCfg }); xhr.ontimeout = function() { cb(false, null); }; xhr.onerror = function() { cb(false, null); }; xhr.onreadystatechange = function() { if (xhr.readyState === 4) { if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) { try { var data = JSON.parse(xhr.responseText); var txt = data.candidates[0].content.parts[0].text || ''; txt = txt.replace(/```json/gi, '').replace(/```/g, '').replace(/^\s+|\s+$/g, ''); var sIdx = txt.indexOf('{'); var eIdx = txt.lastIndexOf('}'); if (sIdx !== -1 && eIdx > sIdx) txt = txt.substring(sIdx, eIdx + 1); var parsed = JSON.parse(txt); cb(true, parsed); return; } catch (e) {} cb(false, null); } else if (xhr.status === 400 && includeThinking) { kadvCallGemini(promptText, false, cb); } else { cb(false, null); } } }; try { xhr.open('POST', url, true); xhr.setRequestHeader('Content-Type', 'application/json'); xhr.send(body); } catch (e) { cb(false, null); } } function kadvChoose(optIdx) { if (!kadvEnsureKey()) return; if (kadvState.finished || kadvState.step > KADV_MAX_STEPS) return; var chosenWord = (kadvState.options && kadvState.options[optIdx]) ? kadvState.options[optIdx] : 'Continue'; var boxEl = document.getElementById('kadv-story-box'); var statusEl = document.getElementById('kadv-status-label'); if (boxEl) boxEl.innerHTML = 'Generating next chapter (' + chosenWord + ')...'; if (statusEl) statusEl.innerHTML = 'Loading...'; for (var i = 0; i < 3; i++) { var b = document.getElementById('kadv-btn-' + i); if (b) b.disabled = true; } var isFinalStep = (kadvState.step === KADV_MAX_STEPS); var prompt = ''; if (isFinalStep) { prompt = "The player has reached the final step 50 of 50 in their text adventure and chose the finale action: '" + chosenWord + "'. Story so far: " + kadvState.story + ". Write a 3 to 4 sentence finale paragraph (50-75 words) that concludes the adventure based on this choice. STRICT RULE: Do not state which option was picked or mention the button word directly—just narrate the ending naturally. Return ONLY JSON: {\"story\": \"ending paragraph\"}"; } else { var nextStepNum = kadvState.step + 1; prompt = "Continue the interactive text adventure at step " + nextStepNum + " of 50 after the player took the action '" + chosenWord + "'.\n" + "Current story: " + kadvState.story + "\n" + "STRICT RULES:\n" + "1. 'story' MUST be a rich paragraph of 3 to 4 sentences (45 to 70 words) continuing naturally without stating 'You chose...' or repeating the action word.\n" + "2. 'options' MUST be exactly 3 choices for the next step, where each choice is strictly ONE single word (e.g. 'Unlock', 'Descend', 'Confront').\n" + (nextStepNum === KADV_MAX_STEPS ? "3. This is step 50 (final choice)! Make these 3 options decide the ultimate finale of the story.\n" : "") + "Return ONLY valid JSON in this exact format:\n" + "{\"story\":\"3-4 sentence continuation paragraph\",\"options\":[\"Word1\",\"Word2\",\"Word3\"]}"; } kadvCallGemini(prompt, true, function(ok, data) { if (ok && data && data.story) { if (isFinalStep) { kadvState.finished = true; kadvState.step = KADV_MAX_STEPS + 1; kadvState.story = kadvCleanPara(data.story); kadvState.options = []; } else { kadvState.step += 1; kadvState.story = kadvCleanPara(data.story); kadvState.options = [ kadvOneWord(data.options && data.options[0], 'Explore'), kadvOneWord(data.options && data.options[1], 'Inspect'), kadvOneWord(data.options && data.options[2], 'Proceed') ]; } kadvSave(); kadvRender(); } else { if (isFinalStep) { kadvState.finished = true; kadvState.step = KADV_MAX_STEPS + 1; kadvState.story = 'Light floods the chamber as the final seal gives way. After fifty trials, your quest reaches its legendary conclusion.'; kadvState.options = []; } else { kadvState.step += 1; kadvState.story = 'You press onward as the path winds deeper into the unknown, revealing new mysteries ahead.'; kadvState.options = ['Venture', 'Search', 'Ascend']; } kadvSave(); kadvRender(); } }); } function kadvNewGame() { if (!kadvEnsureKey()) return; try { localStorage.removeItem('khub_kadv_state_v4'); } catch (e) {} var boxEl = document.getElementById('kadv-story-box'); var statusEl = document.getElementById('kadv-status-label'); var stepEl = document.getElementById('kadv-step-label'); if (stepEl) stepEl.innerHTML = 'Choice 1 / 50'; if (statusEl) statusEl.innerHTML = 'New Story...'; if (boxEl) boxEl.innerHTML = 'Generating a brand-new unique adventure opening...'; for (var i = 0; i < 3; i++) { var b = document.getElementById('kadv-btn-' + i); if (b) { b.disabled = true; b.innerHTML = '...'; } } var seed = KADV_SEEDS[Math.floor(Math.random() * KADV_SEEDS.length)]; var randId = Math.floor(Math.random() * 90000) + 10000; var startPrompt = 'Create a brand-new, original opening scene (Step 1 of 50) for an interactive text adventure set in ' + seed + ' (variation #' + randId + ').\n' + 'STRICT RULES:\n' + '1. "story" MUST be a vivid 3 to 4 sentence opening paragraph (45 to 70 words) plunging the player straight into an intriguing situation.\n' + '2. "options" MUST be exactly 3 distinct starting actions, where each choice is strictly ONE single word (e.g. "Signal", "Board", "Hide").\n' + 'Return ONLY valid JSON: {"story":"opening paragraph","options":["Word1","Word2","Word3"]}'; kadvCallGemini(startPrompt, true, function(ok, data) { kadvState = { step: 1, finished: false, story: (ok && data && data.story) ? kadvCleanPara(data.story) : ('A sudden alarm echoes through ' + seed + ' as emergency lights flicker to life around you. Ahead, a sealed bulkhead hums with unstable energy while footsteps approach from the corridor.'), options: (ok && data && data.options) ? [ kadvOneWord(data.options[0], 'Investigate'), kadvOneWord(data.options[1], 'Hide'), kadvOneWord(data.options[2], 'Override') ] : ['Investigate', 'Hide', 'Override'] }; kadvSave(); kadvRender(); }); } if (kadvEnsureKey()) { if (!kadvLoad()) { kadvNewGame(); } else { kadvRender(); } } </script>
