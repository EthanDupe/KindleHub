<div style='text-align:center;padding:6px;'><div style='border:4px solid #000;padding:12px;margin-bottom:10px;'><div id='kpom-mode' style='font-size:16px;font-weight:bold;text-transform:uppercase;'>Focus Session (25 Min)</div><div id='kpom-time' style='font-size:44px;font-weight:bold;margin:6px 0;font-family:monospace;'>25:00</div><div><button type='button' class='btn btn-selected' id='kpom-btn' onclick='kpomToggle()'>Start</button> <button type='button' class='btn' onclick='kpomReset(25,"Focus Session (25 Min)")'>25m Focus</button> <button type='button' class='btn' onclick='kpomReset(5,"Short Break (5 Min)")'>5m Break</button></div></div><div style='border:3px solid #000;padding:10px;text-align:left;'><div style='font-size:17px;font-weight:bold;margin-bottom:6px;border-bottom:2px solid #000;padding-bottom:4px;'>Daily Habits Checklist</div><div id='kpom-habits'></div><div style='margin-top:8px;'><button type='button' class='btn-sm' onclick='kpomClearHabits()'>Reset Checks</button></div></div></div><script>var kpomSec=1500,kpomRun=false,kpomTimer=null,kpomHabits=[{name:'Read 20 pages on Kindle',done:false},{name:'Drink 8 glasses of water',done:false},{name:'Complete 1 Focus Session',done:false},{name:'Write in Quick Notes',done:false}];try{var sh=localStorage.getItem('khub_pom_habits');if(sh)kpomHabits=JSON.parse(sh);}catch(e){}function kpomDrawTime(){var m=Math.floor(kpomSec/60),s=kpomSec%60;document.getElementById('kpom-time').innerHTML=(m<10?'0'+m:m)+':'+(s<10?'0'+s:s);}function kpomToggle(){kpomRun=!kpomRun;document.getElementById('kpom-btn').innerHTML=kpomRun?'Pause':'Start';if(kpomRun){if(kpomTimer)clearInterval(kpomTimer);kpomTimer=setInterval(function(){if(kpomSec>0){kpomSec-=5;if(kpomSec<0)kpomSec=0;kpomDrawTime();}else{kpomRun=false;clearInterval(kpomTimer);document.getElementById('kpom-btn').innerHTML='Start';document.getElementById('kpom-mode').innerHTML='Session Complete!';}},5000);}else if(kpomTimer){clearInterval(kpomTimer);}}function kpomReset(mins,lbl){kpomRun=false;if(kpomTimer)clearInterval(kpomTimer);kpomSec=mins*60;document.getElementById('kpom-mode').innerHTML=lbl;document.getElementById('kpom-btn').innerHTML='Start';kpomDrawTime();}function kpomDrawHabits(){var h='';for(var i=0;i<kpomHabits.length;i++){var it=kpomHabits[i];h+='<div onclick="kpomFlipHabit('+i+')" style="padding:8px 6px;border-bottom:1px dashed #000;cursor:pointer;font-size:16px;"><strong>'+(it.done?'[X] ':'[ ] ')+'</strong><span style="'+(it.done?'text-decoration:line-through;':'')+'">'+it.name+'</span></div>';}document.getElementById('kpom-habits').innerHTML=h;}function kpomFlipHabit(i){kpomHabits[i].done=!kpomHabits[i].done;try{localStorage.setItem('khub_pom_habits',JSON.stringify(kpomHabits));}catch(e){}kpomDrawHabits();}function kpomClearHabits(){for(var i=0;i<kpomHabits.length;i++)kpomHabits[i].done=false;try{localStorage.setItem('khub_pom_habits',JSON.stringify(kpomHabits));}catch(e){}kpomDrawHabits();}kpomDrawTime();kpomDrawHabits();</script>
