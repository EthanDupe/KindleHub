<div style='text-align:center;padding:6px;'><div style='text-align:left;border-bottom:3px solid #000;padding-bottom:6px;margin-bottom:10px;'><strong style='font-size:20px;'>AI Study Flashcards</strong><span id='kfc-counter' style='float:right;font-weight:bold;font-size:16px;'>Card 1 / 1</span></div><div style='margin-bottom:10px;'><input type='text' id='kfc-topic' placeholder='Enter topic (e.g. Biology, Spanish, History)...' style='width:68%;font-size:16px;padding:8px;border:3px solid #000;background:#fff;color:#000;'> <button type='button' class='btn-sm btn-selected' id='kfc-gen-btn' style='padding:9px 10px;' onclick='kfcGenerate()'>Generate Deck</button></div><div id='kfc-card' onclick='kfcFlip()' style='border:4px solid #000;min-height:170px;padding:22px 16px;margin-bottom:12px;cursor:pointer;background:#fff;color:#000;'><div id='kfc-side-label' style='font-size:13px;font-weight:bold;text-transform:uppercase;margin-bottom:10px;text-decoration:underline;'>Question (Tap Card to Flip)</div><div id='kfc-card-text' style='font-size:21px;font-weight:bold;line-height:1.4;'>Enter any topic above and tap Generate Deck!</div></div><div><button type='button' class='btn' onclick='kfcNav(-1)'>&larr; Prev</button> <button type='button' class='btn btn-selected' onclick='kfcFlip()'>Flip Card</button> <button type='button' class='btn' onclick='kfcNav(1)'>Next &rarr;</button></div></div><script>var kfcCards=[{q:'What is the powerhouse of the eukaryotic cell?',a:'The Mitochondria — it generates most of the cell\'s supply of ATP.'},{q:'What law states F = m * a?',a:'Newton\'s Second Law of Motion.'}],kfcIdx=0,kfcShowAns=false;function kfcRender(){if(!kfcCards||kfcCards.length===0)return;var c=kfcCards[kfcIdx];document.getElementById('kfc-counter').innerHTML='Card '+(kfcIdx+1)+' / '+kfcCards.length;document.getElementById('kfc-side-label').innerHTML=kfcShowAns?'ANSWER (Tap to Flip)':'QUESTION (Tap to Flip)';document.getElementById('kfc-card-text').innerHTML=kfcShowAns?c.a:c.q;}function kfcFlip(){kfcShowAns=!kfcShowAns;kfcRender();}function kfcNav(d){if(!kfcCards||kfcCards.length===0)return;kfcIdx=(kfcIdx+d+kfcCards.length)%kfcCards.length;kfcShowAns=false;kfcRender();}function kfcGenerate(){var key=window.getGlobalApiKey?window.getGlobalApiKey():'';if(!key){if(window.showAiKeyRequiredPopup)window.showAiKeyRequiredPopup('AI Study Flashcards');return;}var topic=(document.getElementById('kfc-topic').value||'General Knowledge').replace(/^\s+|\s+$/g,'');if(!topic)topic='General Science';var btn=document.getElementById('kfc-gen-btn');btn.disabled=true;document.getElementById('kfc-card-text').innerHTML='Generating 8 flashcards on "'+topic+'"...';var xhr=new XMLHttpRequest();xhr.timeout=20000;xhr.open('POST','https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key='+encodeURIComponent(key),true);xhr.setRequestHeader('Content-Type','application/json');var prompt='Create 8 concise study flashcards about: '+topic+'. Return ONLY a valid JSON array of 8 objects with keys "q" (question) and "a" (concise 1-2 sentence answer). Example: [{"q":"...","a":"..."}]';xhr.onreadystatechange=function(){if(xhr.readyState===4){btn.disabled=false;if(xhr.status>=200&&xhr.status<300&&xhr.responseText){try{var d=JSON.parse(xhr.responseText);var txt=d.candidates[0].content.parts[0].text||'';var s=txt.indexOf('['),e=txt.lastIndexOf(']');if(s!==-1&&e>s)txt=txt.substring(s,e+1);var arr=JSON.parse(txt);if(arr&&arr.length>0){kfcCards=arr;kfcIdx=0;kfcShowAns=false;kfcRender();return;}}catch(err){}}document.getElementById('kfc-card-text').innerHTML='Could not generate cards. Check Wi-Fi and try again.';}};try{xhr.send(JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:800}}));}catch(e){btn.disabled=false;}}kfcRender();</script>
