<div style='text-align:center;padding:4px;'><div style='font-size:19px;font-weight:bold;margin-bottom:4px;'>Word Guess E-Ink &mdash; Streak: <span id='kw-streak'>0</span></div><div style='font-size:12px;margin-bottom:6px;'><strong>Black</strong> = Correct Spot | <strong>Dashed</strong> = Wrong Spot | <strong>Light</strong> = Not in Word</div><div id='kw-msg' style='font-size:16px;font-weight:bold;min-height:22px;margin-bottom:6px;'>Guess the 5-letter word!</div><table id='kw-grid' style='margin:0 auto 10px auto;border-collapse:separate;border-spacing:4px;'></table><div id='kw-kb' style='max-width:460px;margin:0 auto;'></div><div style='margin-top:8px;'><button type='button' class='btn-sm' onclick='kwInit()'>New Word</button></div></div><script>var KW_WORDS=['CRANE','SLATE','TRACE','AUDIO','STARE','ROAST','SPARE','SHORE','BRAIN','PLANT','FLAME','LIGHT','WORLD','SOUND','WATER','HEART','STONE','BREAD','CROWN','SMILE','TRAIN','GHOST','STORM','BEACH','CLOUD','DREAM','EARTH','FROST','GLASS','HORSE','JUICE','KNIFE','LEMON','MAGIC','NIGHT','OCEAN','PEARL','QUEEN','RIVER','SOLAR','TIGER','ULTRA','VOICE','WHALE','YOUTH','ZEBRA'];var kwTarget='',kwGuesses=[],kwCur='',kwOver=false,kwStreak=0;try{kwStreak=parseInt(localStorage.getItem('khub_kw_streak')||'0',10)||0;}catch(e){}function kwInit(){kwTarget=KW_WORDS[Math.floor(Math.random()*KW_WORDS.length)];kwGuesses=[];kwCur='';kwOver=false;document.getElementById('kw-msg').innerHTML='Guess the 5-letter word!';document.getElementById('kw-streak').innerHTML=kwStreak;kwDraw();}function kwScoreGuess(g,t){var res=['miss','miss','miss','miss','miss'],tArr=t.split(''),used=[false,false,false,false,false];for(var i=0;i<5;i++){if(g[i]===tArr[i]){res[i]='hit';used[i]=true;}}for(var j=0;j<5;j++){if(res[j]==='hit')continue;for(var k=0;k<5;k++){if(!used[k]&&g[j]===tArr[k]){res[j]='near';used[k]=true;break;}}}return res;}function kwDraw(){var gh='';for(var r=0;r<6;r++){gh+='<tr>';var word=r<kwGuesses.length?kwGuesses[r]:(r===kwGuesses.length?kwCur:'');var sc=r<kwGuesses.length?kwScoreGuess(word,kwTarget):null;for(var c=0;c<5;c++){var ch=word.charAt(c)||'';var st='width:48px;height:48px;font-size:22px;font-weight:bold;text-align:center;vertical-align:middle;';if(sc){if(sc[c]==='hit')st+='background:#000;color:#fff;border:3px solid #000;';else if(sc[c]==='near')st+='background:#fff;color:#000;border:4px dashed #000;';else st+='background:#eee;color:#555;border:2px solid #888;';}else{st+='background:#fff;color:#000;border:2px solid #000;';}gh+='<td style="'+st+'">'+ch+'</td>';}gh+='</tr>';}document.getElementById('kw-grid').innerHTML=gh;var rows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'],kh='';for(var rw=0;rw<rows.length;rw++){kh+='<div style="margin-bottom:4px;">';if(rw===2)kh+='<button type="button" class="btn-sm" style="padding:8px 6px;font-size:13px;" onclick="kwKey(\'ENTER\')">ENTER</button>';for(var m=0;m<rows[rw].length;m++){var L=rows[rw].charAt(m);kh+='<button type="button" class="btn-sm" style="width:36px;padding:8px 0;font-size:15px;margin:1px;" onclick="kwKey(\''+L+'\')">'+L+'</button>';}if(rw===2)kh+='<button type="button" class="btn-sm" style="padding:8px 6px;font-size:13px;" onclick="kwKey(\'DEL\')">DEL</button>';kh+='</div>';}document.getElementById('kw-kb').innerHTML=kh;}function kwKey(k){if(kwOver)return;if(k==='DEL'){if(kwCur.length>0)kwCur=kwCur.substring(0,kwCur.length-1);}else if(k==='ENTER'){if(kwCur.length<5){document.getElementById('kw-msg').innerHTML='Need 5 letters!';return;}kwGuesses.push(kwCur);if(kwCur===kwTarget){kwOver=true;kwStreak++;try{localStorage.setItem('khub_kw_streak',String(kwStreak));}catch(e){}document.getElementById('kw-streak').innerHTML=kwStreak;document.getElementById('kw-msg').innerHTML='Solved in '+kwGuesses.length+'/6! ('+kwTarget+')';}else if(kwGuesses.length>=6){kwOver=true;kwStreak=0;try{localStorage.setItem('khub_kw_streak','0');}catch(e){}document.getElementById('kw-streak').innerHTML='0';document.getElementById('kw-msg').innerHTML='Game Over! Word was: '+kwTarget;}else{document.getElementById('kw-msg').innerHTML='Keep guessing ('+(6-kwGuesses.length)+' left)';}kwCur='';}else if(kwCur.length<5){kwCur+=k;}kwDraw();}kwInit();</script>
